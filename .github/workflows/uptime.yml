# Checks every hour that the live app answers. It never touches the database,
# so the free database can still sleep.
#
# When the app is down it opens an issue that mentions @vipul823, so GitHub
# emails that account (vipul.sharma823@gmail.com). While it stays down nothing
# more is sent. When it answers again the issue is closed with a note, which
# sends a second email. The account owner also gets GitHub's own
# "run failed" email.
name: Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

env:
  APP: https://app.destinytionhospitality.in
  LABEL: app-down
  NOTIFY: vipul823
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Does the app answer?
        id: probe
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$APP/api/health" | grep -qx ok; then
              echo "up=true" >> "$GITHUB_OUTPUT"; echo "App is up."; exit 0
            fi
            echo "No answer (attempt $attempt), trying again in 30 seconds."
            sleep 30
          done
          echo "up=false" >> "$GITHUB_OUTPUT"

      - name: Tell vipul823 it is down
        if: steps.probe.outputs.up == 'false'
        run: |
          gh label create "$LABEL" --color B60205 --description "The live app did not answer" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            gh issue create --label "$LABEL" \
              --title "App is down: $APP did not answer" \
              --body "@$NOTIFY $APP did not answer three times in a row at $(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p') India time. This issue closes by itself when the app answers again."
          else
            echo "Issue #$open is already open; no new email."
          fi
          echo "::error::$APP did not answer three times in a row."
          exit 1

      - name: Close the alert when it is back
        if: steps.probe.outputs.up == 'true'
        run: |
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "@$NOTIFY The app is answering again at $(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p') India time."
          done
